name: KiemTraWebsite

on:
  schedule:
    - cron: "*/5 * * * *"   # Muon 10 phut thi doi thanh "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write            # Can de commit TrangThai.json

concurrency:
  group: kiemtra-website
  cancel-in-progress: false

jobs:
  KiemTra:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Chay kiem tra
        working-directory: src/GiamSatWebsite
        env:
          DANH_SACH_WEBSITE: ${{ secrets.DANH_SACH_WEBSITE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUONG_DAN_TRANG_THAI: ${{ github.workspace }}/TrangThai.json
        run: dotnet run -c Release

      - name: Luu TrangThai.json
        run: |
          if [[ -n "$(git status --porcelain TrangThai.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TrangThai.json
            git commit -m "Cap nhat trang thai website"
            for LanThu in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            echo "Khong push duoc TrangThai.json sau 3 lan thu."
            exit 1
          fi
